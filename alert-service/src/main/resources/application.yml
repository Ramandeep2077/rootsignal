spring:
  application:
    name: alert-service
  datasource:
    url: jdbc:postgresql://localhost:5432/oncall
    username: oncall
    password: oncall-local-dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:19092
    template:
      # Adds a producer span and W3C traceparent header to every record -> the Python consumer continues the trace.
      observation-enabled: true
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5

oncall:
  alerts-topic: alerts.raw
  decisions-topic: incidents.decisions
  # Shared secret for the /api/internal/** endpoints the agent service calls.
  internal-api-token: change-me-local-only
  cors-allowed-origins: http://localhost:3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
    # Spans are always created (so traceparent propagates into Kafka headers); export is opt-in.
    export:
      enabled: ${ONCALL_TRACING_EXPORT:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
