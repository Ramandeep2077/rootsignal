[project]
name = "rootsignal-evals"
version = "0.1.0"
description = "Evaluation harness for rootsignal"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rootsignal-common",
    "rootsignal-agent",
    "rootsignal-simulator",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rootsignal_evals"
