name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  alert-service:
    name: alert-service (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alert-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers uses the runner's Docker daemon for Postgres + Redpanda.
      - run: ./mvnw -B verify

  python:
    name: python services (agent, mcp, simulator, evals)
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      EMBEDDINGS_PROVIDER: hash
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: oncall
          POSTGRES_PASSWORD: oncall-local-dev
          POSTGRES_DB: oncall
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oncall" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest common simulator mcp-servers agent-service evals -m "not ollama"

  dashboard:
    name: dashboard (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test --if-present
      - run: npm run build

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose --profile app --profile observability --profile aws config --quiet

  images:
    name: build image (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [alert-service, python, dashboard]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: alert-service
            context: alert-service
            file: alert-service/Dockerfile
          - image: agent-service
            context: .
            file: agent-service/Dockerfile
          - image: mcp-servers
            context: .
            file: mcp-servers/Dockerfile
          - image: dashboard
            context: dashboard
            file: dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build only (no registry push from CI); the GitHub Actions cache keeps rebuilds fast.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: oncall-copilot/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  terraform:
    name: terraform (fmt, validate, plan against LocalStack)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    services:
      localstack:
        image: localstack/localstack:4.14
        env:
          SERVICES: s3,iam,sts,ec2,secretsmanager,logs
        ports: ["4566:4566"]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.5"
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      - name: Wait for LocalStack
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:4566/_localstack/health && break; sleep 2; done
      - name: Plan the full AWS stack
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false -var target=localstack -no-color
      - name: Apply and destroy the free-tier subset
        if: github.event_name == 'pull_request'
        run: |
          terraform apply -input=false -auto-approve -var-file=localstack.tfvars
          terraform destroy -input=false -auto-approve -var-file=localstack.tfvars
