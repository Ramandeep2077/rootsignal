# uv workspace: all Python components share one lockfile and one virtualenv,
# but each is its own installable package with its own dependencies.
[project]
name = "rootsignal"
version = "0.1.0"
description = "Workspace root for the Python services of rootsignal"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["common", "simulator", "mcp-servers", "agent-service", "evals"]

[tool.uv.sources]
rootsignal-common = { workspace = true }
rootsignal-simulator = { workspace = true }
rootsignal-mcp = { workspace = true }
rootsignal-agent = { workspace = true }
rootsignal-evals = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# E501: the formatter owns line length; long string literals are left intact.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["rootsignal_common", "rootsignal_sim", "rootsignal_mcp", "rootsignal_agent", "rootsignal_evals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --import-mode=importlib"
markers = [
    "integration: needs running Postgres/Kafka (docker compose up)",
    "ollama: needs a local Ollama server with the configured models",
]
