[project]
name = "oncall-simulator"
version = "0.1.0"
description = "Synthetic microservices and labelled incident scenarios"
requires-python = ">=3.12,<3.13"
dependencies = [
    "oncall-common",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "oncall_sim"
