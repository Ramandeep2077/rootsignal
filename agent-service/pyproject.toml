[project]
name = "rootsignal-agent"
version = "0.1.0"
description = "LangGraph incident triage, investigation and remediation agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rootsignal-common[local-embeddings]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.3",
    "aiokafka>=0.11",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "pyyaml>=6",
]

[project.scripts]
rootsignal-agent = "rootsignal_agent.app:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rootsignal_agent"
