[project]
name = "oncall-agent"
version = "0.1.0"
description = "LangGraph incident triage, investigation and remediation agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "oncall-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["httpx>=0.27"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "oncall_agent"
